<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">DMP planning and review loop</title>
  <desc id="d">Six steps in a loop: draft, review, implement, update, deposit and preserve, report to funder, then back to draft. The update step feeds back into the earlier steps.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#005587"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Atkinson Hyperlegible", Arial, sans-serif; fill: #003B5C; }
    .h { font-size: 20px; font-weight: 700; }
    .s { font-size: 15px; }
    .box { fill: #eef4fa; stroke: #2774AE; stroke-width: 2.5; }
    .hot { fill: #FFD100; stroke: #003B5C; stroke-width: 2.5; }
    .arr { stroke: #005587; stroke-width: 3; fill: none; marker-end: url(#a); }
  </style>
  <g class="arr">
    <path d="M292 113H348"/>
    <path d="M458 146L508 226"/>
    <path d="M508 294L458 374"/>
    <path d="M348 407H292"/>
    <path d="M172 374L122 294"/>
    <path d="M122 226L172 146"/>
  </g>
  <g>
    <rect class="box" x="140" y="82" width="150" height="62" rx="10"/>
    <text class="h" x="215" y="108" text-anchor="middle">1 Draft</text>
    <text class="s" x="215" y="130" text-anchor="middle">Researcher</text>
    <rect class="box" x="350" y="82" width="150" height="62" rx="10"/>
    <text class="h" x="425" y="108" text-anchor="middle">2 Review</text>
    <text class="s" x="425" y="130" text-anchor="middle">Librarian</text>
    <rect class="box" x="455" y="229" width="150" height="62" rx="10"/>
    <text class="h" x="530" y="255" text-anchor="middle">3 Implement</text>
    <text class="s" x="530" y="277" text-anchor="middle">Project staff</text>
    <rect class="hot" x="350" y="376" width="150" height="62" rx="10"/>
    <text class="h" x="425" y="402" text-anchor="middle">4 Update</text>
    <text class="s" x="425" y="424" text-anchor="middle">As things change</text>
    <rect class="box" x="140" y="376" width="150" height="62" rx="10"/>
    <text class="h" x="215" y="402" text-anchor="middle">5 Deposit</text>
    <text class="s" x="215" y="424" text-anchor="middle">Preserve or restrict</text>
    <rect class="box" x="35" y="229" width="150" height="62" rx="10"/>
    <text class="h" x="110" y="255" text-anchor="middle">6 Report</text>
    <text class="s" x="110" y="277" text-anchor="middle">To the funder</text>
  </g>
  <text class="h" x="320" y="250" text-anchor="middle">A loop,</text>
  <text class="h" x="320" y="276" text-anchor="middle">not a pipeline</text>
  <text class="s" x="320" y="302" text-anchor="middle">Step 4 feeds steps 1 to 3</text>
</svg>
